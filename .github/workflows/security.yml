name: Security & Maintenance

on:
  # Security checks on main/dev pushes (actual deployed code)
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  # Dependency review on pull requests
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  # Manual trigger for security scans
  workflow_dispatch:

jobs:
  # Removed dependency-audit job - dependabot handles this better

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    # Skip when running locally with act
    if: github.actor != 'nektos/act'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for analysis
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only run on pull requests (needs base/head ref comparison)
    if: github.event_name == 'pull_request' && github.actor != 'nektos/act'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  maintenance-summary:
    name: Security Summary
    needs: [codeql-analysis]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Security scan summary
        run: |
          echo "🛡️ Security & Maintenance Summary"
          echo "================================="
          echo "✅ CodeQL Analysis: ${{ needs.codeql-analysis.result }}"
          echo ""
          if [[ "${{ needs.codeql-analysis.result }}" == "success" ]]; then
            echo "🎉 Security checks passed!"
            echo "ℹ️  Dependency scanning handled by dependabot"
          else
            echo "⚠️  Security check failed - please review"
          fi
